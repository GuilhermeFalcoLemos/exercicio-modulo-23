name: teste CI

on:
  push:
    branches: [ feature/ci ]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout projeto de testes
        uses: actions/checkout@v4

      - name: Checkout Hub de Leitura
        uses: actions/checkout@v4
        with:
          repository: GuilhermeFalcoLemos/hub-de-leitura-integrado
          path: hub-de-leitura-integrado

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do Hub
        working-directory: hub-de-leitura-integrado
        run: npm ci

      - name: Instalar dependências dos testes
        run: npm ci

      - name: Executar testes e gerar relatório
        run: npm run ci

      - name: Publicar relatório
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mochawesome-report